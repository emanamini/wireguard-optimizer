# ============================================================
# VPN Optimizer
# Main configuration
# ============================================================

# Permanent project directory
BASE_DIR="/opt/router/vpn-optimizer"

# Temporary working directory
TEMP_BASE_DIR="/dev/shm/vpn-optimizer"

# Permanent state directory
STATE_DIR="$BASE_DIR/state"

# ------------------------------------------------------------
# Temporary interfaces
# ------------------------------------------------------------

TUN0_TEMP_INTERFACE="tun8"
TUN1_TEMP_INTERFACE="tun9"


# ------------------------------------------------------------
# Concurrent VPN connections
# ------------------------------------------------------------

ALLOW_CONCURRENT_CONNECTIONS="no"

# Seconds to wait after stopping a production VPN
# and before starting candidate testing.
VPN_PRODUCTION_COOLDOWN_SECONDS=5
VPN_TEST_COOLDOWN_SECONDS=2
# ============================================================
# Ping test
# ============================================================

PING_TEST_DESTINATION="8.8.8.8"
PING_TIMEOUT_SECONDS=3


# ------------------------------------------------------------
# TUN0 ping thresholds
# ------------------------------------------------------------

TUN0_PING_COUNT=6
TUN0_MAX_PACKET_LOSS=20
TUN0_MAX_AVERAGE_LATENCY=200


# ------------------------------------------------------------
# TUN1 ping thresholds
# ------------------------------------------------------------

TUN1_PING_COUNT=5
TUN1_MAX_PACKET_LOSS=20
TUN1_MAX_AVERAGE_LATENCY=300


# ------------------------------------------------------------
# Download test
# ------------------------------------------------------------

# Put your own large static file URL here.
DOWNLOAD_TEST_URL="https://ftp.snt.utwente.nl/pub/software/gimp/gimp/v3.2/linux/GIMP-3.2.4-x86_64.AppImage"

# First-stage test
DOWNLOAD_EARLY_SIZE_MB=5
DOWNLOAD_EARLY_MIN_MBPS=5

# Second-stage test
DOWNLOAD_FINAL_SIZE_MB=20
DOWNLOAD_FINAL_MIN_MBPS=30

# ------------------------------------------------------------
# Download test timeouts
# ------------------------------------------------------------

DOWNLOAD_EARLY_MAX_SECONDS=10
DOWNLOAD_FINAL_MAX_SECONDS=30


#Either domain or ip
CANDIDATE_CONFLICT_MODE=domain

# Endpoint route scan scope.
#
# Controls which VPN candidate directories are scanned by
# 00-endpoint-route.sh.
#
# Allowed values:
#   tun0  = scan only tun0 candidates
#   tun1  = scan only tun1 candidates
#   both  = scan both tun0 and tun1 candidates
#
# 00-endpoint-route.sh runs only once per optimizer execution.
#
ENDPOINT_ROUTE_SCOPE="both"

# ============================================================
# VPN HEALTH MONITOR
# ============================================================

HEALTH_MIN_SPEED_MBPS=50

HEALTH_PING_DESTINATION=8.8.8.8
HEALTH_PING_COUNT=5
HEALTH_PING_TIMEOUT_SECONDS=2
HEALTH_MAX_PACKET_LOSS_PERCENT=40
HEALTH_MAX_AVERAGE_LATENCY_MS=500

HEALTH_TEST_SIZE_MB=20
HEALTH_RETRY_COUNT=2
HEALTH_RETRY_DELAY_SECONDS=10
HEALTH_MAX_DOWNLOAD_SECONDS=15
HEALTH_CHECK_PING=yes

